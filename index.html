<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinFlow AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9',
                600: '#0284c7',
                900: '#0c4a6e',
              },
              dark: {
                bg: 'var(--color-bg)',
                card: 'var(--color-card)',
                text: 'var(--color-text)',
                muted: 'var(--color-muted)',
                border: 'var(--color-border)',
                input: 'var(--color-input)',
                hover: 'var(--color-hover)',
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --color-bg: #f8fafc;
        --color-card: #ffffff;
        --color-text: #0f172a;
        --color-muted: #64748b;
        --color-border: #e2e8f0;
        --color-input: #f1f5f9;
        --color-hover: #f1f5f9;
      }

      .dark {
        --color-bg: #0f172a;
        --color-card: #1e293b;
        --color-text: #f8fafc;
        --color-muted: #94a3b8;
        --color-border: #334155;
        --color-input: #0f172a;
        --color-hover: #334155;
      }

      body {
        background-color: var(--color-bg);
        color: var(--color-text);
        font-family: 'Inter', sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--color-bg); 
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-border); 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-muted); 
      }

      @keyframes pulse-alert {
        0%, 100% {
          background-color: rgba(244, 63, 94, 0.05);
          box-shadow: inset 4px 0 0 0 rgba(244, 63, 94, 0.3);
        }
        50% {
          background-color: rgba(244, 63, 94, 0.15);
          box-shadow: inset 4px 0 0 0 rgba(244, 63, 94, 1);
        }
      }

      @keyframes glow-warning {
        0%, 100% {
          box-shadow: 0 0 5px rgba(245, 158, 11, 0.2), inset 0 0 5px rgba(245, 158, 11, 0.1);
          border-color: rgba(245, 158, 11, 0.4);
        }
        50% {
          box-shadow: 0 0 15px rgba(245, 158, 11, 0.6), inset 0 0 10px rgba(245, 158, 11, 0.3);
          border-color: rgba(245, 158, 11, 0.8);
        }
      }

      .animate-overdue {
        animation: pulse-alert 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .animate-glow-warning {
        animation: glow-warning 2s ease-in-out infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.1/",
    "react/": "https://esm.sh/react@^19.2.1/",
    "react": "https://esm.sh/react@^19.2.1",
    "lucide-react": "https://esm.sh/lucide-react@^0.560.0",
    "recharts": "https://esm.sh/recharts@^3.5.1",
    "xlsx": "https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs",
    "jspdf": "https://esm.sh/jspdf@2.5.1",
    "jspdf-autotable": "https://esm.sh/jspdf-autotable@3.8.2"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
