<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FinFlow AI</title>
    
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.json" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 900: '#0c4a6e' },
              dark: { bg: 'var(--color-bg)', card: 'var(--color-card)', text: 'var(--color-text)', muted: 'var(--color-muted)', border: 'var(--color-border)', input: 'var(--color-input)', hover: 'var(--color-hover)' }
            }
          }
        }
      }
    </script>
    <style>
      :root { --color-bg: #f8fafc; --color-card: #ffffff; --color-text: #0f172a; --color-muted: #64748b; --color-border: #e2e8f0; --color-input: #f1f5f9; --color-hover: #f1f5f9; }
      .dark { --color-bg: #0f172a; --color-card: #1e293b; --color-text: #f8fafc; --color-muted: #94a3b8; --color-border: #334155; --color-input: #0f172a; --color-hover: #334155; }
      body { background-color: var(--color-bg); color: var(--color-text); font-family: 'Inter', sans-serif; transition: background-color 0.3s ease; margin: 0; }
      #root:empty { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: white; }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "recharts": "https://esm.sh/recharts@2.13.3",
    "xlsx": "https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs",
    "jspdf": "https://esm.sh/jspdf@2.5.1",
    "jspdf-autotable": "https://esm.sh/jspdf-autotable@3.8.2",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
    <script>
      window.process = { env: { API_KEY: "" } };
      window.onerror = function(msg, url, line, col, error) {
        const root = document.getElementById('root');
        root.innerHTML = `<div style="padding:40px;text-align:center;font-family:sans-serif;">
          <h1 style="color:#ef4444">Erro Crítico</h1>
          <p style="color:#94a3b8">${msg}</p>
          <p style="font-size:12px;color:#64748b">${url}:${line}</p>
          <button onclick="location.reload()" style="margin-top:20px;padding:10px 20px;background:#0ea5e9;color:white;border:none;border-radius:8px;cursor:pointer">Tentar Novamente</button>
        </div>`;
      };
    </script>
  </head>
  <body>
    <div id="root">Carregando FinFlow AI...</div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
