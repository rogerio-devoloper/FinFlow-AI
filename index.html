<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FinFlow AI</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinFlow AI" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/10384/10384163.png" />
    <link rel="manifest" href="manifest.json" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9',
                600: '#0284c7',
                900: '#0c4a6e',
              },
              dark: {
                bg: 'var(--color-bg)',
                card: 'var(--color-card)',
                text: 'var(--color-text)',
                muted: 'var(--color-muted)',
                border: 'var(--color-border)',
                input: 'var(--color-input)',
                hover: 'var(--color-hover)',
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --color-bg: #f8fafc;
        --color-card: #ffffff;
        --color-text: #0f172a;
        --color-muted: #64748b;
        --color-border: #e2e8f0;
        --color-input: #f1f5f9;
        --color-hover: #f1f5f9;
      }

      .dark {
        --color-bg: #0f172a;
        --color-card: #1e293b;
        --color-text: #f8fafc;
        --color-muted: #94a3b8;
        --color-border: #334155;
        --color-input: #0f172a;
        --color-hover: #334155;
      }

      body {
        background-color: var(--color-bg);
        color: var(--color-text);
        font-family: 'Inter', sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
        overscroll-behavior-y: contain;
        margin: 0;
        padding: 0;
      }
      
      #root {
        min-height: 100vh;
      }

      @keyframes pulse-alert {
        0%, 100% {
          background-color: rgba(244, 63, 94, 0.05);
          box-shadow: inset 4px 0 0 0 rgba(244, 63, 94, 0.3);
        }
        50% {
          background-color: rgba(244, 63, 94, 0.15);
          box-shadow: inset 4px 0 0 0 rgba(244, 63, 94, 1);
        }
      }

      .animate-overdue {
        animation: pulse-alert 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react": "https://esm.sh/react@19.0.0",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "recharts": "https://esm.sh/recharts@2.13.3",
    "xlsx": "https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs",
    "jspdf": "https://esm.sh/jspdf@2.5.1",
    "jspdf-autotable": "https://esm.sh/jspdf-autotable@3.8.2",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
    <script>
      // Shim obrigatório para evitar white screen por falta de process
      window.process = { env: { API_KEY: "" } };
      
      window.onerror = function(msg, url, line) {
        console.error("Erro Detectado: ", msg, " em ", url, ":", line);
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Carregamento explícito do módulo principal com extensão -->
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
